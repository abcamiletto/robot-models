name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev --all-extras ty check

  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev --all-extras pytest -q -m fast

  functional-tests:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --all-extras --frozen
      - name: Download test assets
        env:
          HF_HUB_DISABLE_XET: "1"
        run: uv run robot-models download all --output-dir tests/assets/models_hub
      - name: Run cross-runtime functional tests
        run: |
          uv run pytest -q \
            tests/test_public_api.py \
            tests/test_runtime.py \
            tests/test_backend_consistency.py \
            tests/test_compile.py \
            tests/test_gradients.py \
            tests/test_hand_fidelity.py \
            tests/test_hand_control.py \
            tests/test_mujoco.py \
            tests/test_models.py

  # A version in pyproject.toml without its release is tagged and released once every check passes on main.
  release:
    if: github.event_name == 'push'
    needs: [lint, format, typecheck, fast-tests, functional-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Release a new version
        run: |
          tag="v$(uv version --short)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          uv build
          gh release create "$tag" dist/*.whl dist/*.tar.gz --target "$GITHUB_SHA" --title "$tag" --generate-notes
