name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev --all-extras ty check

  fast-tests:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev --all-extras pytest -q -m fast

  functional-tests:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Download test assets
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          uvx --from huggingface-hub hf download \
            abcamiletto/body-models-assets \
            --repo-type dataset \
            --local-dir tests/assets \
            --include 'models_hub/brainco/**' \
            --include 'models_hub/g1/**' \
            --include 'models_hub/myofullbody/**'
      - run: uv sync --group dev --all-extras --frozen
      - name: Run cross-runtime functional tests
        run: |
          uv run pytest -q \
            tests/test_runtime.py \
            tests/test_backend_consistency.py \
            tests/test_g1.py \
            tests/test_smpl_humanoid.py
