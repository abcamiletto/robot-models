site_name: robot-models
site_url: https://abcamiletto.github.io/robot-models/
site_author: Andrea Boscolo Camiletto
site_description: Rigid articulated robot models for NumPy, PyTorch, and JAX
repo_name: robot-models
repo_url: https://github.com/abcamiletto/robot-models

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            inherited_members: true
            members_order: source
            merge_init_into_class: true

markdown_extensions:
  - tables
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - API Reference: api.md
  - MuJoCo integration: mujoco.md
  - Architecture: architecture.md
  - Teaser rendering: teasers.md
  - Hand sources and validation: hand-sources.md
  - Models:
      - Ability Hand: models/ability.md
      - Allegro: models/allegro.md
      - Barrett BH280: models/barrett.md
      - BrainCo: models/brainco.md
      - EZGripper: models/ezgripper.md
      - G1: models/g1.md
      - GR1: models/gr1.md
      - H1: models/h1.md
      - Inspire: models/inspire.md
      - LEAP Hand: models/leap.md
      - Robotiq 3-Finger: models/robotiq.md
      - Sharpa Wave: models/sharpa.md
      - Shadow: models/shadow.md
      - T1: models/t1.md
      - TALOS: models/talos.md

strict: true
